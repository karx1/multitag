[package]
name = "multitag"
version = "0.4.3"
edition = "2021"
description = "A crate for reading and writing music metadata in a variety of formats"
license = "MIT"
repository = "https://github.com/karx1/multitag"
homepage = "https://karx.xyz/projects/multitag"
readme = "README.md"

[dependencies]
id3 = { version = "1.14.0", optional = true }
mp4ameta = { version = "0.13.0", optional = true }
metaflac = { version = "0.2.8", optional = true }
opusmeta = { version = "3.0.0", optional = true }
oggmeta = { version = "1.2.3", optional = true }

[features]
# default = ["mp3", "mp4", "flac", "opus", "ogg"]
default = ["mp4", "flac", "opus", "ogg"]
mp3 = ["dep:id3"]
mp4 = ["dep:mp4ameta"]
flac = ["dep:metaflac"]
opus = ["dep:opusmeta"]
ogg = ["dep:oggmeta"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
